[alembic]
script_location = backend/alembic
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be added to sys.path
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
timezone = UTC

sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/krivio_db

[post_write_hooks]

[logging]
default_handler = console

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
